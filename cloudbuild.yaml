# Cloud Build configuration for APIX Backend
# Builds Docker image and deploys to Cloud Run

substitutions:
  _SERVICE_NAME: apix-backend
  _REGION: us-central1

steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=300'
      - '--set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=$PROJECT_ID,BACKEND_URL=https://apix-backend-7l7wteq2cq-uc.a.run.app,LLM_PROVIDER=claude,LLM_MODEL=claude-3-5-sonnet-20241022'
      - '--set-secrets=THIRDWEB_SECRET_KEY=THIRDWEB_SECRET_KEY:latest,THIRDWEB_CLIENT_ID=THIRDWEB_CLIENT_ID:latest,THIRDWEB_SERVER_WALLET_ADDRESS=THIRDWEB_SERVER_WALLET_ADDRESS:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,BUILDER_SECRET_PHRASE=BUILDER_SECRET_PHRASE:latest,CLOUDINARY_CLOUD_NAME=CLOUDINARY_CLOUD_NAME:latest,CLOUDINARY_API_KEY=CLOUDINARY_API_KEY:latest,CLOUDINARY_API_SECRET=CLOUDINARY_API_SECRET:latest'

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
