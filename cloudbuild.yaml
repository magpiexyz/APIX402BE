# Cloud Build configuration for APIX Backend
# Runs tests, builds Docker image, and deploys to Cloud Run

substitutions:
  _SERVICE_NAME: apix-backend
  _REGION: us-central1

steps:
  # Install dependencies
  - name: 'node:20'
    entrypoint: yarn
    args: ['install', '--frozen-lockfile']
    id: 'install'

  # Run tests
  - name: 'node:20'
    entrypoint: yarn
    args: ['test']
    id: 'test'
    waitFor: ['install']

  # Run tests with coverage (optional - for reporting)
  - name: 'node:20'
    entrypoint: yarn
    args: ['test:coverage']
    id: 'coverage'
    waitFor: ['install']

  # Build TypeScript
  - name: 'node:20'
    entrypoint: yarn
    args: ['build']
    id: 'build'
    waitFor: ['test']

  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build']
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=300'
      - '--set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=$PROJECT_ID,THIRDWEB_SECRET_KEY=${_THIRDWEB_SECRET_KEY},THIRDWEB_CLIENT_ID=${_THIRDWEB_CLIENT_ID},THIRDWEB_SERVER_WALLET_ADDRESS=${_THIRDWEB_SERVER_WALLET_ADDRESS},ANTHROPIC_API_KEY=${_ANTHROPIC_API_KEY},LLM_PROVIDER=${_LLM_PROVIDER},LLM_MODEL=${_LLM_MODEL}'

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
